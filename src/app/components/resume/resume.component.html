<main class="resume-redirect" aria-labelledby="resume-redirect-title">
  <div class="resume-redirect-card">
    <p class="eyebrow">Résumé</p>
    <h1 id="resume-redirect-title">Opening the full résumé.</h1>
    <p>The current résumé is available as an external document.</p>
    <a class="resume-fallback" [href]="resumeUrl" target="_blank" rel="noopener noreferrer">
      Continue to résumé <span>(opens in a new tab)</span>
    </a>
  </div>
</main>
