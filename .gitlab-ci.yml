stages:
  - test
  - build
  - deploy

default:
  image: node:24.21.0-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .cache/puppeteer
  before_script:
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline

test:
  stage: test
  before_script:
    - apt-get update
    - apt-get install --no-install-recommends -y libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 libxshmfence1
    - npm ci --cache .npm --prefer-offline
    - npx puppeteer browsers install chrome
  script:
    - npm run test-report-generate

production-build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

compress-images:
  stage: build
  image:
    name: 343dev/optimizt:latest
    entrypoint: [""]
  before_script: []
  needs:
    - job: production-build
      artifacts: true
  script:
    - find dist -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.gif' -o -iname '*.svg' \) -exec optimizt {} +
    - optimizt --avif dist
    - optimizt --webp dist
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

compress-files:
  stage: build
  needs:
    - job: compress-images
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install --no-install-recommends -y brotli gzip
  script:
    - find dist -type f \( -iname '*.*' ! -iname '*.gz' ! -iname '*.br' \) -exec gzip -k --best {} \;
    - find dist -type f \( -iname '*.*' ! -iname '*.gz' ! -iname '*.br' \) -exec brotli -k {} \;
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  stage: deploy
  before_script: []
  needs:
    - job: compress-files
      artifacts: true
  script:
    - mv dist/lukekuenneke.com/browser public
  artifacts:
    paths:
      - public/
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
